<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Generator</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;color:#222}
  h1{margin-bottom:.2rem} .sub{color:#666;margin-top:0}
  label{display:block;font-weight:600;margin:1rem 0 .3rem}
  textarea,input[type=text]{width:100%;box-sizing:border-box;padding:.5rem;font:inherit;border:1px solid #bbb;border-radius:6px}
  textarea{min-height:170px}
  button{background:#2563eb;color:#fff;border:0;padding:.7rem 1.2rem;border-radius:6px;font-size:1rem;cursor:pointer;margin-top:1rem}
  button:disabled{background:#9ab}
  #drop{border:2px dashed #999;border-radius:8px;padding:1.5rem;text-align:center;cursor:pointer}
  #drop.over{background:#eef}
  #msg{margin-top:1rem;padding:.6rem;border-radius:6px;display:none}
  .err{background:#fee;color:#900;display:block!important}.ok{background:#efe;color:#060;display:block!important}
  ul{max-height:150px;overflow:auto;color:#555}
</style>
</head>
<body>
<h1>Letter Generator</h1>
<p class="sub">Upload a CSV of names. Get a ZIP of Word letters, one per person. Everything runs in your browser; no data is uploaded.</p>

<label>Names file (.csv, one name per row, single column; header "Name" optional)</label>
<div id="drop">Click or drop a .csv file here<input id="file" type="file" accept=".csv,text/csv" hidden></div>
<div id="fileinfo"></div>
<ul id="preview"></ul>

<label for="subject">Subject</label>
<input type="text" id="subject" value="A Message for You">
<label for="body">Letter body (same for everyone; blank line = new paragraph)</label>
<textarea id="body">I hope this letter finds you well.

We are writing to thank you for your continued support and to share an update on our work. Your involvement means a great deal to us, and we look forward to staying in touch.

Please do not hesitate to contact us if you have any questions.</textarea>
<label for="sign">Sign-off</label>
<textarea id="sign" style="min-height:70px">Sincerely,
The Team</textarea>

<button id="go" disabled>Generate ZIP</button>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
